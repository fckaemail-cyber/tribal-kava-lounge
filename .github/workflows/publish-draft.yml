name: Publish Approved Draft

on:
  workflow_dispatch:
    inputs:
      draft_file:
        description: 'Draft file to publish (e.g., digest-2026-08-20.md)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          
      - name: Install Netlify CLI
        run: npm install -g netlify-cli@27.4.1
        
      - name: Approve and publish draft
        env:
          DRAFT_FILE: ${{ inputs.draft_file }}
        run: |
          cd daily-engine
          python3 run_daily.py approve --file "drafts/$DRAFT_FILE"
          python3 auto_publish.py
          
      - name: Commit and push changes
        env:
          DRAFT_FILE: ${{ inputs.draft_file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-engine/state/
          git add daily-kava.js
          git commit -m "chore: publish $DRAFT_FILE" || exit 0
          git push
          
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DRAFT_FILE: ${{ inputs.draft_file }}
        run: |
          netlify deploy --dir=. --auth="$NETLIFY_AUTH_TOKEN" --site="$NETLIFY_SITE_ID" --message "Published $DRAFT_FILE"
          
      - name: Summary
        env:
          DRAFT_FILE: ${{ inputs.draft_file }}
        run: |
          {
            echo "## Draft Published Successfully"
            echo "- Draft: $DRAFT_FILE"
            echo "- Time: $(date -u)"
            echo "- Status: Published and deployed"
            echo "- Site: https://tribalkavalounge.com"
          } >> "$GITHUB_STEP_SUMMARY"
