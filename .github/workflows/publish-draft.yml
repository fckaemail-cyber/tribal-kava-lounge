name: Publish Approved Draft

on:
  workflow_dispatch:
    inputs:
      draft_file:
        description: 'Draft file to publish (e.g., digest-2026-08-20.md)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Netlify CLI
        run: npm install -g netlify-cli
        
      - name: Approve and publish draft
        run: |
          cd daily-engine
          python3 run_daily.py approve --file "drafts/${{ inputs.draft_file }}"
          python3 auto_publish.py
          
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-engine/state/
          git add daily-kava.js
          git commit -m "chore: publish ${{ inputs.draft_file }}" || exit 0
          git push
          
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy --dir=. --auth=$NETLIFY_AUTH_TOKEN --site=$NETLIFY_SITE_ID --message "Published ${{ inputs.draft_file }}"
          
      - name: Summary
        run: |
          echo "## Draft Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Draft: ${{ inputs.draft_file }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Published and deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Site: https://tribalkavalounge.com" >> $GITHUB_STEP_SUMMARY
