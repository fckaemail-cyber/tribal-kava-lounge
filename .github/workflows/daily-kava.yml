name: Daily Kava Auto-Publish

on:
  schedule:
    # Run daily at 11:00 UTC (6 AM ET / 7 AM EDT)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Netlify CLI
        run: npm install -g netlify-cli
        
      - name: Run daily engine (fetch + draft + check)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          cd daily-engine
          python3 run_daily.py run
          
      - name: Auto-approve passing drafts
        run: |
          cd daily-engine
          # Auto-approve any drafts that passed compliance
          for draft in drafts/*.md; do
            if [ -f "$draft" ]; then
              python3 run_daily.py approve --file "$draft" || true
            fi
          done
          
      - name: Publish approved drafts to daily-kava.js
        run: |
          cd daily-engine
          python3 auto_publish.py
          
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-engine/
          git add daily-kava.js
          git add sitemap.xml
          git commit -m "chore: auto-publish daily kava post $(date +%Y-%m-%d)" || exit 0
          git push
          
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy --prod --dir=. --auth=$NETLIFY_AUTH_TOKEN --site=$NETLIFY_SITE_ID
          
      - name: Summary
        run: |
          echo "## Daily Kava Auto-Publish Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "- Site: https://tribalkavalounge.com" >> $GITHUB_STEP_SUMMARY
