name: Daily Kava Auto-Publish

on:
  schedule:
    # Run daily at 11:00 UTC (6 AM ET / 7 AM EDT)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Netlify CLI
        run: npm install -g netlify-cli
        
      - name: Run daily engine (fetch + draft + check)
        run: |
          cd daily-engine
          python3 run_daily.py run
          
      - name: Commit draft changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-engine/state/
          git add daily-engine/drafts/
          git commit -m "chore: daily draft $(date +%Y-%m-%d) - awaiting review" || exit 0
          git push
          
      - name: Summary
        run: |
          echo "## Daily Kava Draft Created" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Draft created and awaiting manual review" >> $GITHUB_STEP_SUMMARY
          echo "- Next: Review draft in daily-engine/drafts/, then manually approve and publish" >> $GITHUB_STEP_SUMMARY
